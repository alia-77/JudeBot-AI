<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JudeBot</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="/static/style.css">

    <!-- Markdown -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

    <!-- Highlight.js -->
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github.min.css">

    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
</head>

<body data-mode="chat">

<div class="container">

    <header>

        <div class="brand">
            <span class="mark">J</span>
            <div class="brand-text">
                <h1>JudeBot</h1>
                <p id="modeSubtitle">Your AI assistant</p>
            </div>
        </div>

        <div class="header-controls">

            <div class="mode-toggle" id="modeToggle" role="tablist" aria-label="Conversation mode">
                <button
                    class="mode-option active"
                    id="modeChat"
                    role="tab"
                    aria-selected="true"
                    data-mode="chat"
                >
                    Chat
                </button>
                <button
                    class="mode-option"
                    id="modeTutor"
                    role="tab"
                    aria-selected="false"
                    data-mode="tutor"
                >
                    Français
                </button>
                <span class="mode-indicator" id="modeIndicator" aria-hidden="true"></span>
            </div>

            <button id="clearBtn" title="Clear chat">
                Clear
            </button>

        </div>

    </header>

    <div id="chat-box">
        <div class="empty-state" id="emptyState">
            <p id="emptyStateText">Ask a question, share a document, or just say hello.</p>
        </div>
    </div>

    <div id="typing" class="hidden">
        <span class="typing-dots"><span></span><span></span><span></span></span>
        <span id="typingText">JudeBot is thinking</span>
    </div>

    <div class="input-container">

        <textarea
            id="message"
            rows="1"
            placeholder="Message JudeBot..."
        ></textarea>

        <div class="buttons">

            <button id="uploadBtn" title="Attach a document or image">
                📎
            </button>

            <button id="sendBtn">
                Send
            </button>

        </div>

    </div>

    <input
        type="file"
        id="fileInput"
        hidden
    >

</div>

<script src="/static/script.js"></script>

</body>

</html>
